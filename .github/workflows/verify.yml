name: Verify BE YOU PWA
on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/verify.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/verify.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate app assets and syntax
        working-directory: app
        run: |
          npm test
          node --check functional.js
          node --check ui-primitives.js
          node --check sw.js