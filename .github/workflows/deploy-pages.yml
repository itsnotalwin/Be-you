name: Deploy BE YOU to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy-pages.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Verify and publish app/
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check the real application
        working-directory: app
        run: npm test

      - name: Verify Pages entry point
        run: |
          test -f app/index.html
          test -f app/manifest.webmanifest
          test -f app/sw.js
          test -f app/assets/approved/volume-01/01-contemplative-koi-and-sakura.webp

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload app folder as website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./app

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
