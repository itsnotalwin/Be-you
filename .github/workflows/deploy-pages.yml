name: Verify and deploy BE YOU

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy-pages.yml'
      - 'README.md'
      - 'PROJECT.md'
      - 'AGENTS.md'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy-pages.yml'
      - 'README.md'
      - 'PROJECT.md'
      - 'AGENTS.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: be-you-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Source, browser flows and pixel-snapshot quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test dependency
        working-directory: app
        run: npm install --no-package-lock
      - name: Verify the existing application and simulated flows
        working-directory: app
        run: npm test
      - name: Install real browser engines
        working-directory: app
        run: npx playwright install --with-deps chromium webkit
      - name: Test screen rendering, interactions, image geometry and layout
        working-directory: app
        env:
          CI: 'true'
          PLAYWRIGHT_CAPTURE: '1'
        run: npm run test:browser -- --grep-invert @live
      - name: Preserve genuine browser screenshots, traces and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: be-you-browser-evidence
          path: |
            app/test-results/
            app/playwright-report/
          if-no-files-found: warn
          retention-days: 14

  deploy:
    name: Publish only after all browser gates pass
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify Pages entry point and approved original artwork
        run: |
          test -f app/index.html
          test -f app/manifest.webmanifest
          test -f app/sw.js
          test -f app/assets/approved/volume-01/01-contemplative-koi-and-sakura.webp
          test -f app/assets/approved/moods/01-good.webp
      - name: Embed this verified release SHA
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          printf '{"sha":"%s"}\n' "$RELEASE_SHA" > app/release.json
      - uses: actions/configure-pages@v5
      - name: Stage the real app, excluding screenshot baselines and test tooling
        run: |
          mkdir -p "$RUNNER_TEMP/be-you-publish"
          rsync -a \
            --exclude='/tests/' \
            --exclude='/scripts/' \
            --exclude='/playwright.config.mjs' \
            --exclude='/node_modules/' \
            --exclude='/test-results/' \
            --exclude='/playwright-report/' \
            --exclude='/package-lock.json' \
            app/ "$RUNNER_TEMP/be-you-publish/"
          test -f "$RUNNER_TEMP/be-you-publish/index.html"
          test -f "$RUNNER_TEMP/be-you-publish/functional.js"
          test ! -d "$RUNNER_TEMP/be-you-publish/tests"
      - name: Upload verified production-only app
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/be-you-publish
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  live-browser:
    name: Verify the actual published release
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        working-directory: app
        run: npm install --no-package-lock
      - name: Install production smoke browser
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: Confirm release marker, artwork and live mood interaction
        working-directory: app
        env:
          CI: 'true'
          PLAYWRIGHT_BASE_URL: https://itsnotalwin.github.io/Be-you/
          EXPECTED_SHA: ${{ github.sha }}
          PLAYWRIGHT_CAPTURE: '1'
        run: npm run test:browser -- --project=chromium-390 --grep @live
      - name: Retain live browser failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: be-you-live-browser-evidence
          path: |
            app/test-results/
            app/playwright-report/
          if-no-files-found: warn
          retention-days: 14
